<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--s1:#161b22;--s2:#1c2128;--bd:#30363d;--bd2:#3d444d;
  --tx:#e6edf3;--tx2:#8b949e;--tx3:#656d76;
  --ac:#2563EB;--acl:#60a5fa;--ac2:#1d4ed8;
  --ok:#10B981;--er:#f87171;--am:#fbbf24;
  --r:12px;--sans:'Inter',system-ui,sans-serif;--serif:'EB Garamond',Georgia,serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.6}

/* ── NAV ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(13,17,23,.95);backdrop-filter:blur(12px);z-index:100}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx)}
.nav-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--ac),var(--acl));border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(37,99,235,.4)}
.nav-logo svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-title{font-size:14px;font-weight:700;letter-spacing:-.2px}
.nav-links{display:flex;gap:6px}
.nav-link{font-size:12px;color:var(--tx2);text-decoration:none;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;transition:.2s;font-weight:500}
.nav-link:hover{border-color:var(--ac);color:var(--acl)}

/* ── HERO ── */
.hero{background:linear-gradient(180deg,rgba(37,99,235,.06) 0%,transparent 100%);border-bottom:1px solid var(--bd);padding:48px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(37,99,235,.08),transparent);pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acl);background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.25);border-radius:20px;padding:4px 12px;margin-bottom:16px}
.hero-eyebrow svg{width:10px;height:10px;fill:var(--acl)}
.hero h1{font-size:clamp(22px,4vw,34px);font-weight:800;margin-bottom:10px;letter-spacing:-.5px;line-height:1.2}
.hero h1 span{background:linear-gradient(90deg,var(--acl),var(--ok));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{color:var(--tx2);font-size:15px;max-width:460px;margin:0 auto 24px;line-height:1.7}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid;display:inline-flex;align-items:center;gap:5px}
.badge svg{width:10px;height:10px}
.badge-blue{border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08);color:var(--acl)}
.badge-green{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.08);color:var(--ok)}
.badge-amber{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08);color:var(--am)}

/* ── LAYOUT ── */
.main{max-width:780px;margin:0 auto;padding:28px 16px 60px}

/* ── ASK CARD ── */
.ask-card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:28px;position:relative;overflow:hidden}
.ask-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--acl),var(--ok))}
.ask-title{font-size:15px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px;color:var(--tx)}
.ask-title svg{width:18px;height:18px;stroke:var(--acl);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;
  padding:10px 13px;font-size:13px;color:var(--tx);font-family:var(--sans);
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.field textarea{resize:vertical;min-height:96px;line-height:1.65}
.field select option{background:var(--s2)}
.field input::placeholder,.field textarea::placeholder{color:var(--tx3)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}
.anon-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:11px 13px;background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.15);border-radius:10px}
.anon-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac);cursor:pointer;flex-shrink:0}
.anon-row label{font-size:13px;color:var(--tx2);cursor:pointer;line-height:1.4}
.btn-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;letter-spacing:.01em;box-shadow:0 2px 12px rgba(37,99,235,.3)}
.btn-submit:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.4)}
.btn-submit:active{transform:translateY(0)}
.btn-submit svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── SEARCH + FILTERS ── */
.search-filter-wrap{margin-bottom:20px}
.search-wrap{margin-bottom:12px}
.search-inner{position:relative}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--tx3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-box{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 13px 10px 40px;font-size:13px;color:var(--tx);font-family:var(--sans);outline:none;transition:border-color .2s,box-shadow .2s}
.search-box:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-box::placeholder{color:var(--tx3)}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filter-btn{font-size:12px;padding:5px 13px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;transition:.2s;white-space:nowrap;font-weight:500}
.filter-btn.active{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.filter-btn:hover:not(.active){border-color:var(--acl);color:var(--acl)}
.q-count{font-size:11px;color:var(--tx3);margin-left:auto;font-weight:500}

/* ── QUESTION CARDS ── */
.q-card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .15s}
.q-card:hover{border-color:var(--bd2);box-shadow:0 2px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
.q-card.open{border-color:var(--acl);box-shadow:0 0 0 1px rgba(96,165,250,.2)}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.q-cat{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:12px;background:rgba(37,99,235,.1);color:var(--acl);border:1px solid rgba(37,99,235,.2)}
.q-asker{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.q-asker svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.q-time{font-size:11px;color:var(--tx3);margin-left:auto}
.q-text{font-family:var(--serif);font-size:15pt;line-height:1.5;margin-bottom:12px;color:var(--tx);font-weight:400}
.q-footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans-count{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;display:inline-flex;align-items:center;gap:4px}
.ans-count svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ans-count.has-ans{background:rgba(16,185,129,.1);color:var(--ok);border:1px solid rgba(16,185,129,.2)}
.ans-count.no-ans{background:rgba(251,191,36,.08);color:var(--am);border:1px solid rgba(251,191,36,.2)}
.q-stat{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.q-stat svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wa-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid rgba(37,211,102,.25);background:rgba(37,211,102,.06);color:#25D366;cursor:pointer;text-decoration:none;transition:.2s;margin-left:auto;font-weight:600}
.wa-btn:hover{background:rgba(37,211,102,.15)}
.wa-btn svg{width:12px;height:12px;fill:none;stroke:#25D366;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── ANSWERS ── */
.answers-wrap{display:none;margin-top:18px;border-top:1px solid var(--bd);padding-top:18px}
.q-card.open .answers-wrap{display:block}
.answer-card{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:10px;position:relative}
.answer-card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;background:linear-gradient(180deg,var(--ok),rgba(16,185,129,.2));border-radius:0 2px 2px 0}
.ans-adv{font-size:12px;font-weight:700;color:var(--acl);display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ans-adv svg{width:13px;height:13px;stroke:var(--ok);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ans-adv .enroll{font-size:10px;font-weight:400;color:var(--tx3)}
.ans-text{font-family:var(--serif);font-size:13pt;line-height:1.7;color:var(--tx)}
.ans-time{font-size:10px;color:var(--tx3);margin-top:8px}
.upvote-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer;margin-top:10px;transition:.2s;font-weight:500}
.upvote-btn:hover{border-color:var(--ok);color:var(--ok);background:rgba(16,185,129,.05)}
.upvote-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── ANSWER FORM ── */
.ans-form{margin-top:16px;background:rgba(37,99,235,.04);border:1px solid rgba(37,99,235,.15);border-radius:12px;padding:16px}
.ans-form-title{font-size:12px;font-weight:700;color:var(--acl);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.ans-form-title svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ans-form input,.ans-form textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--tx);font-family:var(--sans);outline:none;margin-bottom:8px;transition:border-color .2s}
.ans-form input:focus,.ans-form textarea:focus{border-color:var(--ac)}
.ans-form input::placeholder{color:var(--tx3)}
.ans-form textarea{font-family:var(--serif);font-size:12pt;resize:vertical;min-height:90px;line-height:1.65}
.ans-form textarea::placeholder{font-family:var(--sans);font-size:13px}
.ans-form .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.ans-form .two-col{grid-template-columns:1fr}}
.btn-ans{padding:9px 20px;background:var(--ac);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.btn-ans:hover{background:var(--ac2);transform:translateY(-1px)}
.btn-ans svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
.empty-icon{width:56px;height:56px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty-icon svg{width:28px;height:28px;stroke:var(--tx3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:15px;font-weight:700;margin-bottom:6px}
.empty p{font-size:13px;color:var(--tx3)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ok);color:#fff;font-size:13px;font-weight:600;padding:11px 22px;border-radius:12px;z-index:999;display:flex;align-items:center;gap:8px;box-shadow:0 4px 24px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--er)}
.toast svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── MOBILE ── */
@media(max-width:600px){
  .hero{padding:32px 16px 24px}
  .ask-card{padding:16px}
  .q-card{padding:14px 16px}
  .q-text{font-size:13pt}
}
</style>

      }
    },
    {
      "@type": "Question",
      "name": "What is the limitation period for a cheque bounce case under Section 138 NI Act?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Under Section 138 of the Negotiable Instruments Act 1881, a complaint must be filed within one month of the cause of action arising — which is the date of expiry of the 15-day notice period given to the drawer after dishonour."
      }
    },
    {
      "@type": "Question",

      }

      "@type": "Question",

      "acceptedAnswer": {

      }
    }
  ]
}

</head>

<div class="main">

  <!-- ASK FORM -->
  <div class="ask-card">

    </button>

  <!-- SEARCH + FILTERS -->
  <div class="search-filter-wrap">
    <div class="search-wrap">
      <div class="search-inner">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

      <button class="filter-btn" onclick="setFilter('Property / Real Estate',this)">Property</button>
      <button class="filter-btn" onclick="setFilter('Family / Matrimonial',this)">Family</button>
      <button class="filter-btn" onclick="setFilter('Cheque Bounce / NI Act',this)">Cheque Bounce</button>
      <span class="q-count" id="qCount"></span>
    </div>
  </div>

  <!-- QUESTIONS LIST -->
  <div id="questionsList"></div>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg"></span>
</div>

<script>
var allQuestions=[];
var currentFilter='All';
var searchTerm='';

function onSearch(val){
  searchTerm=val.toLowerCase().trim();
  renderQuestions();
}

function waLink(q){
  var text='*Legal Question — LegalHashChecksum.com*\n\n'+q.question+'\n\nCategory: '+q.category+'\n\nAnswer here: https://legalhashchecksum.com/legal-qa';
  return 'https://wa.me/?text='+encodeURIComponent(text);
}

async function loadQuestions(){
  try{
    var r=await fetch('/api/qa/questions');
    allQuestions=await r.json();
    renderQuestions();
  }catch(e){console.error(e);}
}

function renderQuestions(){
  var list=allQuestions;
  if(currentFilter==='Unanswered') list=list.filter(q=>q.answer_count===0);
  else if(currentFilter==='Answered') list=list.filter(q=>q.answer_count>0);
  else if(currentFilter!=='All') list=list.filter(q=>q.category===currentFilter);
  if(searchTerm) list=list.filter(q=>q.question.toLowerCase().includes(searchTerm)||q.category.toLowerCase().includes(searchTerm)||(q.asker_name||'').toLowerCase().includes(searchTerm));
  document.getElementById('qCount').textContent=list.length+' question'+(list.length!==1?'s':'');
  var el=document.getElementById('questionsList');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><h3>No questions found</h3><p>No questions in this category yet.<br>Be the first to ask!</p></div>';
    return;
  }
  el.innerHTML=list.map(function(q){
    var ansClass=q.answer_count>0?'has-ans':'no-ans';
    var ansLabel=q.answer_count>0?q.answer_count+' answer'+(q.answer_count>1?'s':''):'Unanswered';
    var asker=q.anonymous?'Anonymous':(q.asker_name||'Anonymous');
    return `<div class="q-card" id="qcard-${q.id}" onclick="toggleQuestion(${q.id},this)">
      <div class="q-meta">
        <span class="q-cat">${q.category}</span>
        <span class="q-asker">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${asker}
        </span>
        <span class="q-time">${getTimeAgo(q.created_at)}</span>
      </div>
      <div class="q-text">${escHtml(q.question)}</div>
      <div class="q-footer">
        <span class="ans-count ${ansClass}">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          ${ansLabel}
        </span>
        <span class="q-stat">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          ${q.views||0} views
        </span>
        <a class="wa-btn" href="${waLink(q)}" target="_blank" onclick="event.stopPropagation()">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          Share
        </a>
      </div>
      <div class="answers-wrap" id="ans-${q.id}">
        <div id="ans-list-${q.id}"><p style="font-size:12px;color:var(--tx3);padding:8px 0">Loading answers...</p></div>
        <div class="ans-form" onclick="event.stopPropagation()">
          <div class="ans-form-title">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Answer as Advocate
          </div>
          <div class="two-col">
            <input id="advName-${q.id}" placeholder="Your full name *" onclick="event.stopPropagation()">
            <input id="advEnroll-${q.id}" placeholder="Enrolment No." onclick="event.stopPropagation()">
          </div>
          <input id="advCourt-${q.id}" placeholder="Court / Bar — e.g. Advocate, Allahabad High Court" onclick="event.stopPropagation()">
          <textarea id="advAns-${q.id}" placeholder="Write your legal answer here — cite relevant sections of BNS, BNSS, BSA, CPC etc." onclick="event.stopPropagation()"></textarea>
          <button class="btn-ans" onclick="event.stopPropagation();submitAnswer(${q.id})">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Post Answer
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function toggleQuestion(id,card){
  var isOpen=card.classList.contains('open');
  document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('open'));
  if(isOpen) return;
  card.classList.add('open');
  loadAnswers(id);
  fetch('/api/qa/view/'+id,{method:'POST'}).catch(()=>{});
}

async function loadAnswers(qid){
  var el=document.getElementById('ans-list-'+qid);
  try{
    var r=await fetch('/api/qa/answers/'+qid);
    var ans=await r.json();
    if(!ans.length){
      el.innerHTML='<p style="font-size:12px;color:var(--tx3);margin-bottom:14px;padding:4px 0">No answers yet. Be the first advocate to answer.</p>';
      return;
    }
    el.innerHTML=ans.map(function(a){
      return `<div class="answer-card">
        <div class="ans-adv">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          ${escHtml(a.advocate_name)}
          ${a.advocate_enroll?'<span class="enroll">· '+escHtml(a.advocate_enroll)+'</span>':''}
          ${a.advocate_court?'<span class="enroll">· '+escHtml(a.advocate_court)+'</span>':''}
        </div>
        <div class="ans-text">${escHtml(a.answer)}</div>
        <div class="ans-time">${getTimeAgo(a.created_at)}</div>
        <button class="upvote-btn" onclick="upvote(${a.id},this)">
          <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
          Helpful (${a.upvotes||0})
        </button>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML='<p style="color:var(--er);font-size:12px">Error loading answers.</p>';
  }
}

async function submitQuestion(){
  var q=document.getElementById('qText').value.trim();
  if(!q||q.length<10){showToast('Please write a proper question (min 10 chars)',true);return;}
  var anon=document.getElementById('qAnon').checked;
  var name=document.getElementById('qName').value.trim()||'Anonymous';
  var cat=document.getElementById('qCat').value;
  try{
    var r=await fetch('/api/qa/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,category:cat,asker_name:name,anonymous:anon})});
    if(r.ok){
      document.getElementById('qText').value='';
      document.getElementById('qName').value='';
      showToast('Question posted! Advocates will answer soon.');
      loadQuestions();
    }else{showToast('Error posting question',true);}
  }catch(e){showToast('Network error',true);}
}

async function submitAnswer(qid){
  var name=document.getElementById('advName-'+qid).value.trim();
  var ans=document.getElementById('advAns-'+qid).value.trim();
  if(!name){showToast('Please enter your advocate name',true);return;}
  if(!ans||ans.length<20){showToast('Please write a proper answer (min 20 chars)',true);return;}
  var enroll=document.getElementById('advEnroll-'+qid).value.trim();
  var court=document.getElementById('advCourt-'+qid).value.trim();
  try{
    var r=await fetch('/api/qa/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:qid,answer:ans,advocate_name:name,advocate_enroll:enroll,advocate_court:court})});
    if(r.ok){
      document.getElementById('advAns-'+qid).value='';
      showToast('Answer posted!');
      loadAnswers(qid);
      loadQuestions();
    }else{showToast('Error posting answer',true);}
  }catch(e){showToast('Network error',true);}
}

async function upvote(aid,btn){
  try{
    var r=await fetch('/api/qa/upvote/'+aid,{method:'POST'});
    if(r.ok){
      var d=await r.json();
      btn.innerHTML='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg> Helpful ('+d.upvotes+')';
      btn.style.color='var(--ok)';btn.style.borderColor='var(--ok)';btn.disabled=true;
    }
  }catch(e){}
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderQuestions();
}

function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function getTimeAgo(ts){
  var d=new Date(ts),now=new Date(),diff=Math.floor((now-d)/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}

function showToast(msg,err){
  var t=document.getElementById('toast');
  t.className='toast'+(err?' err':'');
  document.getElementById('toastMsg').textContent=msg;
  setTimeout(()=>t.classList.add('show'),10);
  setTimeout(()=>t.classList.remove('show'),3500);
}

loadQuestions();
setInterval(loadQuestions,30000);
</script>
</body>
</html>
