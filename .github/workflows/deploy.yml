name: CI/CD — Legal Hash Checksum

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python3 -m py_compile main.py && echo "Syntax OK"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/hashverify
            git pull origin main
            venv/bin/pip install -r requirements.txt -q
            sudo systemctl restart hashverify.service
            sleep 6
            for i in 1 2 3; do
              STATUS=$(curl -sf http://localhost:8506/health 2>/dev/null || echo "")
              if echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)" 2>/dev/null; then
                echo "Deploy successful"
                exit 0
              fi
              echo "Waiting for service... attempt $i"
              sleep 4
            done
            echo "Health check failed after retries"
            exit 1
